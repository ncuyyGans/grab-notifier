name: Pantau pesanan Grab

on:
  # Cron GitHub sering telat/dilewati; versi utama ada di cloudflare/worker.js
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: grab-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pantau
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUN_SECONDS: "240"
          POLL: "30"
        run: python track.py
      - name: Simpan state
        run: |
          git config user.name "grab-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git pull --rebase --autostash || true
          git push
